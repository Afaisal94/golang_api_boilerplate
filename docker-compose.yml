name: first-app

services:
  postgres:
    image: postgres:16-alpine
    container_name: first-app-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD wajib diisi di .env}
      POSTGRES_DB: ${DB_NAME:-db_go_api}
      TZ: Asia/Jakarta
    ports:
      - "${DB_PORT_HOST:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-db_go_api}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - backend

  redis:
    image: redis:7-alpine
    container_name: first-app-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
    ports:
      - "${REDIS_PORT_HOST:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ${REDIS_PASSWORD:+-a \"$$REDIS_PASSWORD\"} ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    networks:
      - backend

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: first-app:latest
    container_name: first-app-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Override host agar menunjuk ke service compose, bukan localhost.
      DB_HOST: ${DB_HOST_DOCKER:-postgres}
      DB_PORT: 5432
      REDIS_HOST: ${REDIS_HOST_DOCKER:-redis}
      REDIS_PORT: 6379
    ports:
      - "${APP_PORT_HOST:-3000}:${APP_PORT:-3000}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend

volumes:
  postgres_data:
  redis_data:

networks:
  backend:
    driver: bridge
